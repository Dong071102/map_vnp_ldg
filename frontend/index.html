<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bản đồ Địa giới Lâm Đồng 2025</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21 3 6"></polygon>
          <line x1="9" y1="3" x2="9" y2="18"></line>
          <line x1="15" y1="6" x2="15" y2="21"></line>
        </svg>
      </div>
      <h1>Bản đồ Lâm Đồng</h1>
    </a>

    <nav class="main-nav" aria-label="Điều hướng chính">
      <a class="nav-tab active" href="/">Bản đồ</a>
      <a class="nav-tab" href="/streets">Khu vực phát</a>
      <a class="nav-tab" href="/admin">Quản trị</a>
    </nav>

    <div class="topbar-right">
      <div id="statusBanner" class="status-banner" hidden></div>
      <div id="authMenuHost"></div>
    </div>
  </header>

  <main class="workspace">
    <section class="map-panel">
      <div id="map"></div>

      <div class="map-toolbar">
        <div class="toolbar-group">
          <button type="button" id="fitBoundsBtn" class="tool-btn" disabled>Căn giữa</button>
          <label class="checkbox-inline" title="Lớp 124 xã, phường, đặc khu mới 2025">
            <input type="checkbox" id="showWardsLayerToggle" checked />
            <span>Xã/Phường</span>
          </label>
          <label class="checkbox-inline" title="Lớp 30 huyện, thị xã, thành phố cũ">
            <input type="checkbox" id="showOldDistrictsLayerToggle" />
            <span>Huyện cũ</span>
          </label>
          <label class="checkbox-inline" title="Vị trí và vùng phục vụ các Bưu cục Vận hành">
            <input type="checkbox" id="showBcvhLayerToggle" checked />
            <span>BCVH</span>
          </label>
          <label class="checkbox-inline" title="Hiển thị nhãn tên khu vực trên bản đồ">
            <input type="checkbox" id="showLabelsToggle" />
            <span>Tên vùng</span>
          </label>
          <label class="opacity-control" title="Độ đậm màu tô">
            <span>Độ đậm</span>
            <input type="range" id="opacityRange" min="0.05" max="0.75" step="0.05" value="0.32" />
          </label>
        </div>

        <div class="toolbar-group" id="quickStats">
          <span class="stat-pill" id="statRegions">0 vùng</span>
        </div>
      </div>
    </section>

    <aside class="sidebar-rail">
      <div class="rail-tabs" role="tablist">
        <button type="button" id="mapTabBcvhBtn" class="rail-tab active" role="tab" aria-selected="true">
          Bưu cục VH <span class="tab-count" id="bcvhCount">0</span>
        </button>
        <button type="button" id="mapTabRegionsBtn" class="rail-tab" role="tab" aria-selected="false">
          Địa giới <span class="tab-count" id="regionCount">0</span>
        </button>
      </div>

      <!-- Tab 1: BCVH List -->
      <div id="mapPanelBcvh" class="rail-panel">
        <div class="rail-toolbar">
          <button type="button" id="clearBcvhFocusBtn" class="btn small" hidden>Hiện tất cả</button>
          <a id="exportAllBcvhExcelBtn" class="btn small export-bcvh-excel-btn" href="/api/bcvh/export-excel" title="Xuất tất cả BCVH ra file Excel theo mẫu VNPost">Xuất Excel tất cả</a>
          <a id="manageBcvhLink" class="btn small" href="/admin#bcvh" style="margin-left:auto;" hidden>Quản lý BCVH</a>
        </div>
        <div class="rail-scroll">
          <div id="bcvhListEmpty" class="rail-empty">
            Chưa có Bưu cục Vận hành. Vào <a href="/admin#bcvh">Quản trị → BCVH</a> để cấu hình.
          </div>
          <div id="bcvhList" class="bcvh-list"></div>
        </div>
      </div>

      <!-- Tab 2: Administrative Regions List -->
      <div id="mapPanelRegions" class="rail-panel" hidden>
        <div class="rail-toolbar">
          <input id="regionSearchInput" type="text" class="region-search-input" placeholder="Tìm xã, phường, huyện cũ..." />
          <select id="regionLayerFilter" class="region-layer-select">
            <option value="all">Tất cả</option>
            <option value="ward_2025">Xã/Phường</option>
            <option value="district_old">Huyện cũ</option>
          </select>
          <button type="button" id="reloadDbBtn" class="mini-btn" title="Tải lại từ SQL Server">↻</button>
        </div>
        <div class="rail-scroll">
          <div id="regionListEmpty" class="rail-empty">Chưa có khu vực phù hợp.</div>
          <div id="regionList" class="region-list"></div>
        </div>
      </div>

      <!-- Collapsible GeoJSON Output Drawer -->
      <div class="geojson-drawer">
        <div class="geojson-drawer-head">
          <span class="geojson-drawer-title">GeoJSON</span>
          <div class="json-actions">
            <button type="button" id="copyBtn" class="btn small" disabled>Copy</button>
            <button type="button" id="downloadGeojsonBtn" class="btn small primary" disabled>.geojson</button>
            <button type="button" id="toggleGeojsonDrawerBtn" class="btn small" aria-expanded="false">Mở ▴</button>
          </div>
        </div>

        <div id="geojsonDrawerBody" class="geojson-drawer-body" hidden>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;">
            <div class="export-tabs" role="tablist">
              <button type="button" class="tab-btn active" data-export-mode="merged">Gộp tất cả</button>
              <button type="button" class="tab-btn" data-export-mode="selected">Đang chọn</button>
            </div>
            <div class="json-actions">
              <label class="checkbox-inline" title="Chỉ giữ Polygon/MultiPolygon">
                <input type="checkbox" id="polygonsOnlyToggle" checked />
                <span>Polygon</span>
              </label>
              <label class="checkbox-inline" title="Format nhiều dòng xem trước (Copy vẫn 1 dòng)">
                <input type="checkbox" id="prettyToggle" />
                <span>Format</span>
              </label>
              <button type="button" id="downloadJsonBtn" class="btn small" disabled>.json</button>
            </div>
          </div>

          <div id="metaCard" class="meta-grid" hidden style="padding:6px 8px;background:#fff;border:1px solid var(--border);border-radius:6px;">
            <div class="meta-row"><span class="meta-key">Đang chọn</span><span class="meta-val strong" id="metaName">—</span></div>
            <div class="meta-row" id="metaDescRow" hidden><span class="meta-key">Mô tả</span><span class="meta-val" id="metaDesc">—</span></div>
            <div class="meta-row"><span class="meta-key">Thông số</span><span class="meta-val" id="metaMetrics">—</span></div>
            <span id="sourceBadge" hidden></span>
            <span id="metaIds" hidden></span>
            <div id="metaLinks" hidden></div>
            <details id="traceBox" hidden><summary></summary><ul id="traceList"></ul></details>
          </div>

          <div id="jsonNote" class="json-note" hidden></div>
          <pre id="jsonPreview" class="json-preview"><code>// Chọn vùng hoặc double-click trên bản đồ để copy nhanh 1 dòng</code></pre>
        </div>
      </div>
    </aside>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
