services:
  lamdong-map:
    image: ghcr.io/dong071102/map_vnp_ldg:latest
    container_name: lamdong-map
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME:-map_vnp_ldg}"
      DB_ENCRYPT: "${DB_ENCRYPT:-false}"
      ADMIN_USER: "${ADMIN_USER:-lamdong}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
