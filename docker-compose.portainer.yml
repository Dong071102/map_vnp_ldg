services:
  lamdong-map:
    image: ${IMAGE_NAME:-ghcr.io/dong071102/map_vnp_ldg:latest}
    container_name: lamdong-map
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME:-getjson}"
      DB_ENCRYPT: "${DB_ENCRYPT:-false}"
      ADMIN_USER: "${ADMIN_USER:-lamdong}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
